[build]
builder = "NIXPACKS"

[deploy]
startCommand = "php artisan migrate --force && php artisan db:seed --force --class=KrishnaResortsSeeder || true && php artisan storage:link || true && php artisan config:cache && php artisan route:cache && php artisan view:cache && php -S 0.0.0.0:$PORT -t public"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
